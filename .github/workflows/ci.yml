name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test
    # Windows, like the AppVeyor pipeline this replaces: UserService and its tests use Windows
    # time zone IDs, which TimeZoneInfo.GetSystemTimeZones() does not return on Linux.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/api/Directory.Packages.props', 'src/api/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Release skips the API project's Debug-only TakeAppOffline target (a 10 s ping) on restore.
      - name: Restore
        run: dotnet restore Shrooms.sln -p:Configuration=Release

      - name: Build
        id: build
        run: dotnet build Shrooms.sln --configuration Release --no-restore

      # Each suite runs even if an earlier one failed, so one red run shows every failure.
      - name: Test Shrooms.Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test Shrooms.Tests/Shrooms.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger trx --results-directory ../../TestResults

      - name: Test Shrooms.Premium.Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test Shrooms.Premium.Tests/Shrooms.Premium.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger trx --results-directory ../../TestResults

      - name: Test Shrooms.EmailTemplates.Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test Shrooms.EmailTemplates.Tests/Shrooms.EmailTemplates.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger trx --results-directory ../../TestResults

      - name: Upload test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload API build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api
          path: src/api/Shrooms.Presentation.Api/bin/Release/net10.0/
          if-no-files-found: error
