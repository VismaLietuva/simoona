image: Visual Studio 2022

environment:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

install:
  - ps: |
      $version = "10.0.103"
      $installer = "dotnet-sdk-$version-win-x64.exe"
      $url = "https://dotnetcli.azureedge.net/dotnet/Sdk/$version/$installer"
      (New-Object Net.WebClient).DownloadFile($url, "$env:TEMP\$installer")
      Start-Process -FilePath "$env:TEMP\$installer" -ArgumentList "/quiet", "/norestart" -Wait
      $env:PATH = "C:\Program Files\dotnet;$env:PATH"
  - dotnet --version

build_script:
  - dotnet restore src\api\Shrooms.sln
  - dotnet build src\api\Shrooms.sln --configuration Release --no-restore

test_script:
  - dotnet test src\api\Shrooms.Tests\Shrooms.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
  - dotnet test src\api\Shrooms.Premium.Tests\Shrooms.Premium.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

artifacts:
  - path: src\api\Shrooms.Presentation.Api\bin\Release\net10.0\
    name: api
